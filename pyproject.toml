[project]
name = "subtitles"
version = "0.1.0"
description = "macOS 实时字幕工具：系统音频采集 + 流式 ASR + 智能断句 + 悬浮双语字幕"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "websockets>=13.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyobjc-framework-ScreenCaptureKit>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
subtitles = "subtitles.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
